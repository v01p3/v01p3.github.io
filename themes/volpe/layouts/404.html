<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}" data-theme="light">
<head>
{{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="site-main">
    <div class="wrap not-found">
      <h1>404</h1>
      <p>Page not found.</p>
      <a href="{{ "/" | relLangURL }}">{{ i18n "backToHome" }}</a>
    </div>
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/theme.js" | relURL }}" defer></script>
  <script src="{{ "js/nav.js" | relURL }}" defer></script>
</body>
</html>
