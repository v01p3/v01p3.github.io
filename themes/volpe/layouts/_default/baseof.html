<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}" data-theme="light">
<head>
{{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/theme.js" | relURL }}" defer></script>
  <script src="{{ "js/nav.js" | relURL }}" defer></script>
</body>
</html>
