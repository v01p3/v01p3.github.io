{{ define "main" }}
<div class="wrap">
  <h1 class="page-title">{{ .Title }}</h1>
  <ul class="term-list">
    {{ range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="term-count">{{ .Count }}</span></li>
    {{ end }}
  </ul>
</div>
{{ end }}
