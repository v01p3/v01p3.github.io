{{ define "main" }}
<article class="wrap post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "article-meta.html" . }}
    {{ with .Params.tags }}
    <ul class="tag-list">
      {{ range . }}<li><a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/">#{{ . }}</a></li>{{ end }}
    </ul>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  {{ partial "author-box.html" . }}
</article>
{{ end }}
