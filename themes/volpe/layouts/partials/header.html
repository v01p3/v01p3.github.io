<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ "/" | relLangURL }}">
      <span class="logo" aria-hidden="true">🦊</span>{{ .Site.Title }}
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
      {{ partial "theme-toggle.html" . }}
    </nav>
    <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="{{ i18n "toggleMenu" }}">
      <svg class="icon icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
</header>
